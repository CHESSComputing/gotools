name: Build

# on:
#   push:
#     branches: [ master ]
#   pull_request:
#     branches: [ master ]
on:
  push:
    tags:
      - "*.*.*"

# Permission can be added at job level or workflow level
permissions:
  contents: write # Required to create releases and upload release assets

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          make build_all

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: "LAST_CHANGES.md"
          draft: false
          prerelease: false
          files: |
            ./tools_linux_amd64.tar.gz
            ./tools_linux_power8.tar.gz
            ./tools_linux_arm64.tar.gz
            ./tools_darwin_amd64.tar.gz
            ./tools_darwin_arm64.tar.gz
            ./tools_windows_amd64.zip
            ./tools_windows_arm64.zip
